name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Eval (mock backend, no network)
        run: go run ./cmd/wiseyolo eval --backend mock

      - name: Doctor (mock backend, no network)
        run: go run ./cmd/wiseyolo doctor --backend mock
